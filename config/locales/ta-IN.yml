    toolbar:
      source: "மூலக் குறியீடு (HTML)"
      paragraph_style: "பத்தி நடை"
      align: "சீரமைப்பு"
      outdent: "உள்தள்ளலைக் குறை"
      indent: "உள்தள்ளலை அதிகரி"
      bold: "தடிமன்"
      italic: "சாய்வு"
      underline: "அடிக்கோடு"
      strike: "நடுக்கோடு"
      font: "எழுத்துரு"
      font_size: "எழுத்துரு அளவு"
      text_color: "உரையின் நிறம்"
      background_color: "உரையின் பின்னணி நிறம்"
      undo: "செயல்தவிர்"
      redo: "மீண்டும் செய்"
      collapsible: "சுருக்கக்கூடிய தொகுதி"
      code: "குறியீடு"
