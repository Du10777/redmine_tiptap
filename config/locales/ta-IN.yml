      insert: "செருகு"

    link_dialog:
      title: "இணைப்பைச் செருகு"
      text: "உரை"
      text_placeholder: "இணைப்பு உரை"
      url: "URL"

    table_dialog:
      title: "அட்டவணையைச் செருகு"
      rows: "வரிசைகள்"
      columns: "நெடுவரிசைகள்"
      header_row: "முதல் வரிசை தலைப்பாக"

    attachment_dialog:
      title: "இணைக்கப்பட்ட கோப்பைச் செருகு"
      empty: "பதிவேற்றப்பட்ட கோப்புகள் எதுவும் இல்லை"

    image_dialog:
      title: "படத்தைச் செருகு"
