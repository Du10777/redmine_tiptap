      normal: "இயல்பான உரை"
      subheading4: "துணைத்தலைப்பு 4"
      subheading5: "துணைத்தலைப்பு 5"
      subheading6: "துணைத்தலைப்பு 6"
      monospace: "நிலையான அகல உரை"

    align_options:
      left: "இடப்புறம் சீரமை"
      center: "மையத்தில் சீரமை"
      right: "வலப்புறம் சீரமை"
      justify: "இருபுறமும் சீரமை"

    font_options:
      default: "இயல்புநிலை"
      size_placeholder: "அளவு"

    color_picker:
      reset: "மீட்டமை"

