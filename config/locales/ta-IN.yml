      bullet_square: "▪ புள்ளிக்குறிகள் (சதுரங்கள்)"
      decimal: "1. எண்ணிடல் (1, 2, 3)"
      decimal_zero: "01. எண்ணிடல் (01, 02)"
      lower_alpha: "a. எண்ணிடல் (a, b, c)"
