      add_column_right: "வலப்புறம் நெடுவரிசையைச் சேர்"
      delete_column: "நெடுவரிசையை நீக்கு"
      add_row_above: "மேலே வரிசையைச் சேர்"
      add_row_below: "கீழே வரிசையைச் சேர்"
      delete_row: "வரிசையை நீக்கு"
      merge_cells: "கலங்களை ஒன்றிணை"
      split_cell: "கலத்தைப் பிரி"
      header_row: "முதல் வரிசை தலைப்பாக"
      header_column: "முதல் நெடுவரிசை தலைப்பாக"
      delete_table: "அட்டவணையை நீக்கு"

    quote:
      default_header: "எழுதியவர், தேதி"
      default_text: "மேற்கோள் உரை"

    collapsible:
      default_title: "தலைப்பு"
      default_content: "உள்ளடக்கம்"

    code_block:
      badge_title: "குறியீட்டுத் தொகுதியின் மொழி – தேர்வுசெய்ய கிளிக் செய்யவும்"
      badge_empty: "மொழி"
      search_language: "மொழியைத் தேடு"
      nothing_found: "எதுவும் கிடைக்கவில்லை"
      no_highlighting: "தனிப்படுத்தல் இல்லை (plaintext)"
      recent: "சமீபத்தில் பயன்படுத்தியவை"
      frequent: "அடிக்கடி பயன்படுத்தியவை"
      all_languages: "அனைத்து மொழிகளும்"

    resizer:
      title: "திருத்தியின் உயரத்தை மாற்ற இழுக்கவும், தானியங்கு உயரத்தை மீட்டமைக்க இருமுறை கிளிக் செய்யவும்"
