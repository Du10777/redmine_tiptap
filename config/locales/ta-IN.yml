      horizontal_rule: "கிடைமட்டக் கோடு"
      quote: "மேற்கோள்"
      link: "இணைப்பு"
      unlink: "இணைப்பை அகற்று"
      list: "பட்டியல்"
      insert_table: "அட்டவணையைச் செருகு"
      insert_attachment: "இணைக்கப்பட்ட கோப்பைச் செருகு"
      insert_image: "இணைக்கப்பட்ட கோப்புகளிலிருந்து படத்தைச் செருகு"

    paragraph_styles:
      heading1: "தலைப்பு 1"
