    # How the syntax highlighting languages look in Russian, in the language list and on
    # the badge of a code block. The base texts (label, hint, keywords) are English and
    # are in the language files of the highlight/ folder. Here label and hint replace
    # them, and keywords are extra words for the search, added to the English ones.
    code_languages:
      "1c":
        label: "1С"
        hint: "1С:Предприятие"
        keywords: "1с предприятие"
      accesslog:
        keywords: "логи"
      cisco-ios:
        keywords: "циско"
      journalctl:
        keywords: "журнал логи"
      log:
        hint: "логи сервисов Linux"
        keywords: "логи журнал"
      routeros:
        keywords: "микротик"
